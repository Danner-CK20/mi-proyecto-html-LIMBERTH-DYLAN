<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Galería virtual de arte estudiantil de la comunidad educativa de Comarapa.">
    <title>Galería Virtual Estudiantil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor-acceso">

        <section class="tarjeta-acceso">

            <div class="logo" aria-hidden="true">🎨</div>

            <h1>Galería Virtual Estudiantil</h1>

            <p class="subtitulo">
                Un espacio para compartir y valorar el talento artístico
                de nuestros estudiantes.
            </p>

            <form id="formLogin">

                <div class="grupo-formulario">

                    <label for="correo">Correo electrónico</label>

                    <input
                        type="email"
                        id="correo"
                        autocomplete="email"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>

                <div class="grupo-formulario">

                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="Ingrese su contraseña"
                        required
                    >

                </div>

                <p id="mensajeError" class="mensaje-error" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn btn-principal">
                    Iniciar sesión
                </button>

            </form>

            <div class="separador">
                <span>o</span>
            </div>

            <a href="registro.html" class="btn btn-secundario">
                Registrarse
            </a>

            <button
                id="btnInvitado"
                class="btn btn-invitado"
                type="button"
            >
                Ingresar como invitado
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
